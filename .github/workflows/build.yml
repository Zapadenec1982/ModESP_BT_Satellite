# Builds the firmware exactly as docs/BASE.md describes and runs the host tests.
#
# The container is the official ESP-IDF image for the version idf.pin names.
# Verified on Docker Hub on 2026-09-21: the tag espressif/idf:v5.5.5 exists
# (linux/amd64 and linux/arm64, pushed 2026-07-17). tools/setup.sh checks the
# image's IDF against idf.pin -- version and commit -- before it copies a byte,
# so a mismatched image fails here rather than producing a quietly different
# Bluedroid.
#
# GitHub Actions does not run the image's entrypoint, so export.sh is sourced
# by hand in the build step; IDF_PATH itself is set by the image (/opt/esp/idf).

name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Host compiler for the host tests
        # The published image is built with IDF_INSTALL_TARGETS=all, which brings
        # build-essential; this is only a guard against an image built without it.
        run: command -v gcc >/dev/null || (apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev)

      - name: components/bt from the pinned IDF plus patches (docs/BASE.md)
        run: tools/setup.sh

      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: Host tests
        run: CC=gcc PYTHON=python3 tools/run_host_tests.sh

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: modesp-bt-satellite-${{ github.sha }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
          if-no-files-found: error
